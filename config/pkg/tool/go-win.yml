go-win:
  type: tool
  artifact:
    binary: custom
    install:
      destination: go-win
      root: go-win
      bin-dir: bin
  env:
    GOROOT: '{pkg_root_path}/go-win'
    GOBIN: '{pkg_root_path}/go-win/bin'
    GOPATH: '{pkg_root_path}/go-win/gopath'
  path@windows:
    - '{pkg_root_path}/go-win/bin'
  tool:
    provides:
      - go.exe
      - gofmt.exe
